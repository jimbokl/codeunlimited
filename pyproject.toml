[project]
name = "codeunlimited-reference"
version = "0.1.0"
description = "Legacy Python reference implementation for codeunlimited detector prototyping."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["claude-code", "codex", "tokens", "rate-limits", "cost-optimization"]

[project.scripts]
codeunlimited-reference = "codeunlimited.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codeunlimited"]
