<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18">
  <style>
    .t { fill: #57606a; } .v { fill: #24292f; font-weight: 600; } .h { fill: #24292f; font-weight: 600; }
    .rng { stroke: #57606a; stroke-width: 3; } .cap { stroke: #57606a; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #8b949e; } .v { fill: #e6edf3; } .h { fill: #e6edf3; }
      .rng, .cap { stroke: #8b949e; }
    }
  </style>
  <text x="10" y="27" class="h" font-size="22">Detector ranges — model parameters, not measured savings</text>
  <text x="10" y="52" class="t" font-size="16">Whisker = low–high assumption · green dot = midpoint</text>

  <text x="10" y="88" class="v">Long-session context</text>
  <line x1="330" y1="83" x2="474" y2="83" class="rng"/><line x1="330" y1="76" x2="330" y2="90" class="cap"/><line x1="474" y1="76" x2="474" y2="90" class="cap"/>
  <circle cx="402" cy="83" r="7" fill="#2ea44f"/><text x="500" y="89" class="t">40–80% · mid 60%</text>

  <text x="10" y="132" class="v">Top-tier short replies</text>
  <line x1="303" y1="127" x2="483" y2="127" class="rng"/><line x1="303" y1="120" x2="303" y2="134" class="cap"/><line x1="483" y1="120" x2="483" y2="134" class="cap"/>
  <circle cx="393" cy="127" r="7" fill="#2ea44f"/><text x="500" y="133" class="t">25–75% · mid 50%</text>

  <text x="10" y="176" class="v">Fat session start</text>
  <line x1="303" y1="171" x2="483" y2="171" class="rng"/><line x1="303" y1="164" x2="303" y2="178" class="cap"/><line x1="483" y1="164" x2="483" y2="178" class="cap"/>
  <circle cx="393" cy="171" r="7" fill="#2ea44f"/><text x="500" y="177" class="t">25–75% · mid 50%</text>

  <text x="10" y="220" class="v">Retry-storm duplicates</text>
  <line x1="303" y1="215" x2="483" y2="215" class="rng"/><line x1="303" y1="208" x2="303" y2="222" class="cap"/><line x1="483" y1="208" x2="483" y2="222" class="cap"/>
  <circle cx="393" cy="215" r="7" fill="#2ea44f"/><text x="500" y="221" class="t">25–75% · mid 50%</text>

  <text x="10" y="264" class="v">Confirmed cache rewrite</text>
  <circle cx="393" cy="259" r="7" fill="#2ea44f"/><text x="420" y="265" class="t">observed amount · no range</text>

  <text x="10" y="310" class="t" font-size="16">Apply only to flagged exposure · validate comparable completed-task outcomes.</text>
</svg>
