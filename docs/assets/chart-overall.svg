<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18">
  <style>
    .t { fill: #57606a; } .v { fill: #1a7f37; font-weight: 600; } .h { fill: #24292f; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #8b949e; } .v { fill: #3fd158; } .h { fill: #e6edf3; }
    }
  </style>
  <text x="10" y="24" class="h" font-size="22">Historical snapshot: observed vs modeled prompt tokens</text>
  <text x="10" y="56" class="t">EXACT OBSERVED LOG-COUNTER SUM</text>
  <rect x="10" y="64" width="640" height="28" rx="4" fill="#a40e26"/>
  <text x="558" y="85" fill="#ffffff" font-weight="600">3,551M</text>
  <text x="10" y="120" class="t">MODELED BOUNDED TOTAL · first-5 mean × request count</text>
  <rect x="10" y="128" width="94" height="28" rx="4" fill="#2ea44f"/>
  <text x="116" y="150" class="v">519M</text>
  <text x="10" y="173" class="t">Modeled ratio <tspan class="v">x6.8</tspan> · historical selected sessions only.</text>
  <text x="10" y="193" class="t">Counterfactual exposure — not realized savings.</text>
</svg>
