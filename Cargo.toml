[package]
name = "codeunlimited"
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
description = "Local token-efficiency auditing and bounded stateful orchestration for Claude Code and Codex CLI."
license = "MIT"
repository = "https://github.com/jimbokl/codeunlimited"
readme = "README.md"
keywords = ["claude-code", "codex", "tokens", "limits", "audit"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "/codeunlimited/",
    "/pyproject.toml",
    "/scripts/",
    "/docs/launch/",
    "/docs/superpowers/",
    "/.github/",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
chrono = "0.4"
clap = { version = "=4.5.48", features = ["derive"] }
toml = "0.8"
fs2 = "0.4"
tempfile = "=3.14.0"
sha2 = "0.10"
wait-timeout = "0.2"
# Keep fresh Cargo 1.82 resolution from selecting edition-2024 indexmap.
indexmap = "=2.11.4"

[dev-dependencies]
assert_cmd = "=2.0.16"
predicates = "=3.1.3"

[profile.release]
lto = true
codegen-units = 1
