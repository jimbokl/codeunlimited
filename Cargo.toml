[package]
name = "codeunlimited"
version = "1.5.0"
edition = "2021"
description = "Set up once - up to 50% more work from the same Claude Code & Codex CLI limits. Offline token-leak audit, one-command fixes, verified savings."
license = "MIT"
repository = "https://github.com/jimbokl/codeunlimited"
readme = "README.md"
keywords = ["claude-code", "codex", "tokens", "limits", "audit"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/codeunlimited/", "/docs/launch/", "/.github/"]

[dependencies]
serde_json = "1"
rayon = "1"
walkdir = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
